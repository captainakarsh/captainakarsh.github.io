name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        # GitHub Pages only serves static files, so the API routes are left out of this
        # build; the exported site calls the Vercel deployment (Mumbai, bom1) instead.
        run: npm run build:pages
        env:
          NEXT_PUBLIC_SITE_URL: https://captainakarsh.github.io
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://captainakarsh-github-io.vercel.app' }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
