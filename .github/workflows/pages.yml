name: Deploy to GitHub Pages

# Builds the static export and publishes it to the gh-pages branch.
# Settings → Pages → Source should be "Deploy from a branch: gh-pages / (root)".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        # GitHub Pages only serves static files, so the API routes are left out of this
        # build; the exported site calls the Vercel deployment (Mumbai, bom1) instead.
        run: npm run build:pages
        env:
          NEXT_PUBLIC_SITE_URL: https://captainakarsh.github.io
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://captainakarsh-github-io.vercel.app' }}

      - name: Publish to gh-pages
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Deploy static portfolio build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
